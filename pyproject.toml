[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-tcx-running-analyzer"
version = "1.2.1"
description = "Offline Garmin TCX running workout analyzer with AI-ready JSON reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Garmin TCX Running Analyzer contributors"}]
keywords = ["garmin", "tcx", "running", "treadmill", "training", "json", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.scripts]
garmin-tcx-running-analyzer = "garmin_tcx_running_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
