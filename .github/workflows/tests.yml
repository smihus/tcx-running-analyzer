name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed CLI
        run: garmin-tcx-running-analyzer --help
      - name: Verify PowerShell launcher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\Analyze-Tcx.ps1 -Path .\tests\fixtures -Output .\launcher-report.json -ExpectedManifest .\tests\fixtures\expected.txt -ActivityMode auto
          if (-not (Test-Path .\launcher-report.json)) { throw 'JSON missing' }
          $report = Get-Content .\launcher-report.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.summary.archive_completeness.status -ne 'complete') { throw 'Expected-files check failed' }
          if ($report.summary.unique_activities_counted -ne 1) { throw 'v1.4.0 identity summary missing' }

      - name: Verify AI workflow PowerShell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\Running-Workflow.ps1 -Ingest -Workspace .\local-data -UtcOffset '+04:00' -Paths .\tests\fixtures\synthetic-smoke.tcx
          if (-not (Test-Path .\local-data\running-history.json)) { throw 'History missing' }
          .\Running-Workflow.ps1 -Record -Workspace .\local-data -File 'synthetic-smoke.tcx' -Patch .\examples\user-feedback.patch.example.json
          $result = Get-Content .\local-data\running-history.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.activities[0].subjective.foot_pain -ne $false) { throw 'User feedback not merged' }
          .\Running-Workflow.ps1 -Rebuild -Workspace .\local-data
