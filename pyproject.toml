[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcx-running-analyzer"
version = "1.4.1"
description = "Offline TCX running workout analyzer with AI-ready JSON reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TCX Running Analyzer contributors"}]
keywords = ["tcx", "running", "treadmill", "outdoor", "gps", "training", "json", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.scripts]
tcx-running-analyzer = "tcx_running_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
